name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml, scripts/pond.py, scripts/traffic.py, scripts/gotham_koi.py]

permissions:
  contents: write

concurrency: profile

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Check out git-koi
        uses: actions/checkout@v7
        with:
          repository: yalongwastaken/git-koi
          ref: v1.0.2
          path: _gitkoi
      - name: Black-and-gold coat, always cruise
        run: python3 scripts/gotham_koi.py _gitkoi
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            _gitkoi/target
          key: gitkoi-v1.0.2-gotham-${{ hashFiles('scripts/gotham_koi.py') }}-${{ runner.os }}
      - name: Build git-koi
        run: cargo build --release --locked --manifest-path _gitkoi/Cargo.toml
      - name: Draw the koi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin=_gitkoi/target/release/git-koi
          $bin collect "${{ github.repository_owner }}" --output "$RUNNER_TEMP/snapshot.json"
          $bin render "$RUNNER_TEMP/snapshot.json" --output-dir koi --body black
      - name: Put the koi in its pond
        run: |
          python3 -m pip install --quiet --break-system-packages pillow numpy
          python3 scripts/pond.py koi/koi.gif koi/pond.webp
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif koi/pond.webp
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git pull --rebase --quiet && git push --quiet
