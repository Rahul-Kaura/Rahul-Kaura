name: Profile widgets

on:
  schedule:
    - cron: "47 1 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/widgets.yml]

permissions:
  contents: write

concurrency: profile

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#e3b341&color_dots=#11141c,#3d2e0a,#7a5a12,#b8860b,#f2c14e
      - name: Commit the snake
        shell: bash
        run: |
          git add dist
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "widgets: redraw the snake"
          git pull --rebase --quiet && git push --quiet

  summary-cards:
    needs: snake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          TIME_ZONE: America/Los_Angeles
          THEME: great_gatsby
          ANIMATION: sequence
